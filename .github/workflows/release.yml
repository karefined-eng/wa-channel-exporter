name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for extension smoke tests
        run: npx puppeteer browsers install chrome

      - name: Require tag to match package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version tag $expected"
            exit 1
          fi

      - name: Lint extension source
        run: npm run lint

      - name: Build extension artifact
        run: npm run build

      - name: Run regression tests
        run: npm test

      - name: Verify built distribution in Chromium
        run: |
          smoke_dir="$(mktemp -d)"
          node scripts/prepare-extension-smoke.mjs dist "$smoke_dir"
          xvfb-run -a node scripts/test-extension-chrome.mjs "$smoke_dir"

      - name: Verify exact ZIP artifact in Chromium
        shell: bash
        run: |
          extracted="$(mktemp -d)"
          unzip -q wa-channel-exporter.zip -d "$extracted"
          smoke_dir="$(mktemp -d)"
          node scripts/prepare-extension-smoke.mjs "$extracted" "$smoke_dir"
          xvfb-run -a node scripts/test-extension-chrome.mjs "$smoke_dir"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" wa-channel-exporter.zip \
            --verify-tag \
            --generate-notes \
            --title "WA Channel Exporter ${GITHUB_REF_NAME#v}"
