name: Extension CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-extension:
    name: Build and verify extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for extension smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Lint extension source
        run: npm run lint

      - name: Build extension artifact
        run: npm run build

      - name: Run regression tests
        run: npm test

      - name: Verify built distribution in Chromium
        env:
          CHROME_BIN: /usr/bin/chromium
        run: |
          smoke_dir="$(mktemp -d)"
          node scripts/prepare-extension-smoke.mjs dist "$smoke_dir"
          xvfb-run -a node scripts/test-extension-chrome.mjs "$smoke_dir"

      - name: Verify exact ZIP artifact in Chromium
        shell: bash
        env:
          CHROME_BIN: /usr/bin/chromium
        run: |
          extracted="$(mktemp -d)"
          unzip -q wa-channel-exporter.zip -d "$extracted"
          smoke_dir="$(mktemp -d)"
          node scripts/prepare-extension-smoke.mjs "$extracted" "$smoke_dir"
          xvfb-run -a node scripts/test-extension-chrome.mjs "$smoke_dir"

      - name: Upload extension artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa-channel-exporter-${{ github.sha }}
          path: wa-channel-exporter.zip
          if-no-files-found: error
          retention-days: 14
