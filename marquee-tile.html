<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee Tile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body, html {
            margin: 0;
            padding: 0;
            width: 1400px;
            height: 560px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #064e3b 0%, #0f172a 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(52, 211, 153, 0.1) 0%, transparent 50%);
            z-index: 1;
        }
        .grid {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
            max-width: 1000px;
        }
        .icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px auto;
            box-shadow: 0 20px 50px rgba(16, 185, 129, 0.4);
        }
        .icon svg {
            width: 60px;
            height: 60px;
            fill: white;
        }
        h1 {
            margin: 0;
            font-size: 84px;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(to right, #fff, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }
        p {
            margin: 20px 0 0 0;
            font-size: 32px;
            color: #d1d5db;
            font-weight: 400;
        }
        .tags {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }
        .tag {
            background: rgba(255,255,255,0.1);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="bg-pattern"></div>
    <div class="content">
        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
        </div>
        <h1>WA Channel Exporter</h1>
        <p>The Ultimate Local Archive Tool for WhatsApp Channels</p>
        <div class="tags">
            <div class="tag">Offline HTML</div>
            <div class="tag">PDF Generation</div>
            <div class="tag">Media Download</div>
        </div>
    </div>
</body>
</html>
