<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Tile (Eleviewer Aesthetic)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500&display=swap');
        body, html {
            margin: 0;
            padding: 0;
            width: 440px;
            height: 280px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }
        
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(37,211,102,0.15) 0%, rgba(18,140,126,0.05) 40%, transparent 70%);
            top: -100px;
            left: -100px;
            z-index: 2;
            border-radius: 50%;
            filter: blur(20px);
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .icon-container {
            width: 64px;
            height: 64px;
            background: rgba(28, 28, 28, 0.7);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
        }
        
        .icon-container::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(37,211,102,0.8), rgba(18,140,126,0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .icon-container svg {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 8px rgba(37,211,102,0.4));
        }

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.04em;
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        p {
            margin: 0;
            font-size: 15px;
            color: #a1a1aa;
            font-weight: 500;
            letter-spacing: -0.01em;
            max-width: 320px;
            line-height: 1.4;
        }

        .badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(28, 28, 28, 0.8);
            color: #25d366;
            padding: 6px 12px;
            border-radius: 100px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid rgba(37,211,102,0.3);
            backdrop-filter: blur(16px);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glow"></div>
    <div class="badge">100% Read-Only</div>
    
    <div class="content">
        <div class="icon-container">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="waGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#25D366" />
                        <stop offset="100%" stop-color="#128C7E" />
                    </linearGradient>
                </defs>
                <g transform="translate(16, 16)" stroke="url(#waGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4 L16 22 M8 14 L16 22 L24 14" />
                    <path d="M4 28 L28 28" />
                </g>
            </svg>
        </div>
        
        <h1>WA Channel Exporter</h1>
        <p>Export & Archive Channels Instantly</p>
    </div>
</body>
</html>
