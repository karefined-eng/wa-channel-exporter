<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- WhatsApp-themed green gradient -->
    <linearGradient id="waGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    
    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Premium Dark Container (Eleviewer Aesthetic) -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="#1c1c1c" stroke="#333333" stroke-width="1.5" />

  <!-- Accent Top Border Glow -->
  <path d="M 12 2 L 52 2" stroke="url(#waGradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" opacity="0.8" />

  <!-- Core Icon: Export/Download & Archive -->
  <g transform="translate(16, 16)" stroke="url(#waGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Downward Arrow (Download/Export) -->
    <path d="M16 4 L16 22 M8 14 L16 22 L24 14" filter="url(#glow)" />
    <!-- Archive Tray -->
    <path d="M4 28 L28 28" filter="url(#glow)" />
  </g>
</svg>
